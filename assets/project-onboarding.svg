<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">ESP32-S3 secure cloud connection</title>
  <desc id="desc">One MQTT over TLS path from an ESP32-S3 to the cloud.</desc>
  <rect width="640" height="360" fill="#fff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="52" y="116" width="132" height="118" rx="13" fill="#eef3f6" stroke="#496f88" stroke-width="4"/>
    <text x="118" y="164" fill="#2e4052" font-size="22" font-weight="700">ESP32-S3</text>
    <text x="118" y="191" fill="#496f88" font-size="15">secure device</text>
    <rect x="456" y="116" width="132" height="118" rx="13" fill="#fff" stroke="#496f88" stroke-width="4"/>
    <text x="522" y="181" fill="#2e78ba" font-family="Arial, sans-serif" font-size="19" font-weight="700">ThingsBoard</text>
    <path d="M184 175h272m-30-17 30 17-30 17" fill="none" stroke="#496f88" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="226" y="117" width="186" height="48" rx="9" fill="#f2e9e4" stroke="#496f88" stroke-width="2"/>
    <text x="319" y="147" fill="#2e4052" font-size="19" font-weight="700">MQTT over TLS</text>
  </g>
</svg>
